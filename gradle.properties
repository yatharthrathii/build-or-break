# Build or Break - Gradle configuration
# See techspec.md section 9.

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# R8 full mode. rules.md section 5 makes this non negotiable for release builds.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
ksp.incremental=true

# Do not generate BuildConfig where it is not needed. Smaller build, fewer
# regenerations.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
