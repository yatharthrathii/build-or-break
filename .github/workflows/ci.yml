name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Static analysis
        run: ./gradlew detekt --no-daemon

      # The domain suite is pure JVM and must stay under one second.
      # See implementationPlan.md M2 exit criteria.
      - name: Domain tests
        run: ./gradlew :core:model:test :core:common:test :core:domain:test :core:testing:test --no-daemon

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore
